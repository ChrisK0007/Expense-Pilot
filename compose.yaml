services:
  expense-pilot:
    build: .
    image: expense-pilot:local
    container_name: expense-pilot
    restart: unless-stopped
    ports:
      - "8788:8788"
    env_file: .env
    environment:
      DATA_DIR: /data
    user: "99:100"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
