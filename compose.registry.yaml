# After publishing to GHCR, set IMAGE in .env to the real repository's image.
# Use this file alone: docker compose -f compose.registry.yaml up -d
services:
  expense-pilot:
    image: ${IMAGE:?Set IMAGE to your published ghcr.io/owner/repository:latest image in .env}
    container_name: expense-pilot
    restart: unless-stopped
    ports:
      - "8788:8788"
    env_file: .env
    environment:
      DATA_DIR: /data
    user: "99:100"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
