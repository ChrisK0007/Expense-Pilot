name: Installation help
description: Ask about Docker setup, updates or recovery.
title: "[Setup] "
body:
  - type: markdown
    attributes:
      value: "Use the guide matching your image's branch. Stable v1.0.2 and the current beta configure AI in the app and allow an optional setup token. Do not attach your data directory or backup."
  - type: input
    id: version
    attributes:
      label: Image tag and previous version if upgrading
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Host and installation method
      placeholder: "Unraid with Docker template / Docker Desktop with Compose"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Where are you stuck?
      description: Link to the instruction step, describe the result and include redacted error text.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, private URLs and personal/financial records from this report.
          required: true
