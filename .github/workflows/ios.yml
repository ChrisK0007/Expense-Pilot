name: Build iPhone development app
on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Check receipt capture and upload bridge
        run: node ios/Tests/receipt_bridge.cjs
      - name: Check server address safety
        run: |
          swiftc ios/ExpensePilot/ServerAddress.swift ios/Tests/main.swift -o "$RUNNER_TEMP/address-tests"
          "$RUNNER_TEMP/address-tests"
      # Xcode 16.4 / iOS 18.5 simulator WebKit overlay bug: Apple forums thread/785964.
      # Override only this CI build; physical-device deployment remains iOS 17.
      - name: Build iPhone simulator app
        run: |
          xcodebuild -project ios/ExpensePilot.xcodeproj -scheme ExpensePilot -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/ExpensePilotBuild" CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY='-' DEVELOPMENT_TEAM='' IPHONEOS_DEPLOYMENT_TARGET=18.4 build > "$RUNNER_TEMP/ios-build.log" 2>&1 || { tail -100 "$RUNNER_TEMP/ios-build.log"; exit 1; }
      - name: Launch in an iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$RUNNER_TEMP/ExpensePilotBuild/Build/Products/Debug-iphonesimulator/ExpensePilot.app"
          if ! xcrun simctl launch "$DEVICE" com.chrisk0007.ExpensePilot.dev; then
            xcrun simctl spawn "$DEVICE" log show --last 3m --style compact --predicate 'process == "ExpensePilot" OR eventMessage CONTAINS "com.chrisk0007.ExpensePilot"' > "$RUNNER_TEMP/ios-launch.log" 2>&1 || true
            tail -100 "$RUNNER_TEMP/ios-launch.log"
            exit 1
          fi
          sleep 15
          xcrun simctl spawn "$DEVICE" log show --last 3m --style compact --predicate 'process == "ExpensePilot" OR eventMessage CONTAINS "com.chrisk0007.ExpensePilot"' > "$RUNNER_TEMP/ios-launch.log" 2>&1 || true
          mkdir -p "$RUNNER_TEMP/crashes"
          find "$HOME/Library/Logs/DiagnosticReports" -name 'ExpensePilot*' -exec cp {} "$RUNNER_TEMP/crashes/" \; || true
          xcrun simctl spawn "$DEVICE" launchctl list > "$RUNNER_TEMP/ios-processes.log"
          xcrun simctl io "$DEVICE" screenshot "$RUNNER_TEMP/iphone-startup.png"
          grep -E '^[0-9]+[[:space:]].*com\.chrisk0007\.ExpensePilot\.dev' "$RUNNER_TEMP/ios-processes.log"
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-build-evidence
          path: |
            ${{ runner.temp }}/ios-build.log
            ${{ runner.temp }}/iphone-startup.png
            ${{ runner.temp }}/ios-launch.log
            ${{ runner.temp }}/ios-processes.log
            ${{ runner.temp }}/crashes
          retention-days: 14
