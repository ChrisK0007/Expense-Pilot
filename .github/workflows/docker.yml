name: Test and publish Docker image
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Syntax checks
        run: |
          node --check static/app.js
          node --check static/billing.js
          node --check static/receipts.js
          python -m py_compile app.py billing.py billing_core.py gunicorn.conf.py reset_password.py tests/test_app.py tests/test_billing.py
          bash -n prepare.sh backup.sh
      - name: Build image
        run: docker build -t expense-pilot:test .
      - name: Integration tests
        run: docker run --rm --entrypoint python -v "$PWD/tests:/app/tests:ro" expense-pilot:test -m unittest discover -s tests -v
      - name: Browser workflow tests
        env:
          UI_OUTPUT: ${{ runner.temp }}/expense-pilot-ui
        run: |
          npm install --prefix "$RUNNER_TEMP/expense-pilot-browser" playwright@1.62.1
          node "$RUNNER_TEMP/expense-pilot-browser/node_modules/playwright/cli.js" install --with-deps chromium
          docker run -d --name expense-pilot-ui -p 127.0.0.1:8788:8788 -e SETUP_TOKEN=browser-test-setup-token-123456789 expense-pilot:test
          NODE_PATH="$RUNNER_TEMP/expense-pilot-browser/node_modules" node tests/ui_smoke.cjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: ${{ runner.temp }}/expense-pilot-ui
          retention-days: 7
          if-no-files-found: ignore
      - name: Image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=sha
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          SOURCE: https://github.com/${{ github.repository }}
        run: |
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              docker tag expense-pilot:test "$tag"
              docker push "$tag"
            fi
          done <<< "$TAGS"
